services:
  - type: web
    name: smat-multiplayer-auction
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: AUCTION_SOURCE
        value: ./data/Auction.py
      - key: MAX_SQUAD
        value: "25"
