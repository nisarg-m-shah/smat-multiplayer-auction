services:
  - type: web
    name: smat-multiplayer-auction
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smat-auction-db
          property: connectionString
      - key: AUCTION_SOURCE
        value: ./data/Auction.py
      - key: MAX_SQUAD
        value: "25"

databases:
  - name: smat-auction-db
    databaseName: smat_auction
    user: smat_auction_user
    plan: 0.5c-1g
    region: singapore
    ipAllowList: []
